name: Mutation Tests

on:
  workflow_dispatch:
  push:
    paths:
      - "core/**"
      - "pom.xml"
      - "**/pom.xml"
      - ".github/workflows/mutation-tests.yml"

jobs:
  mutation-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 24       
          distribution: temurin
          cache: maven           

      # -------------------------------------------------
      # 1. Compiler tout le projet depuis la racine
      #    (dépendances inter-modules)
      # -------------------------------------------------
      - name: Build 
        run: mvn -B -DskipTests install

      # -------------------------------------------------
      # 2. Lancer PiTest uniquement dans le module 'core'
      # -------------------------------------------------
      - name: Run PiTest in core module
        working-directory: ./core
        run: |
          mvn -B org.pitest:pitest-maven:mutationCoverage \
            -DoutputFormats=XML,HTML

      # -------------------------------------------------
      # 3. Calcul du score de mutation
      # -------------------------------------------------
      - name: Compute mutation score
        run: |
          REPORT=./core/target/pit-reports/mutations.xml
          if [ ! -f "$REPORT" ]; then
            echo "❌ mutations.xml introuvable"
            exit 1
          fi

          TOTAL=$(grep -c "<mutation " "$REPORT")
          KILLED=$(grep -c "status='KILLED'" "$REPORT")
          SCORE=$(echo "scale=2; ($KILLED * 100) / $TOTAL" | bc)

          echo "🎯 Mutation Score: $SCORE%"
