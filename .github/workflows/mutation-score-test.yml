name: Mutation Tests
on: push
jobs:
  mutation-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [ 24, 25-ea ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
      - name: Build project
        run: mvn -Dkey=$API_KEY clean install -B
      - name: Run mutation tests
        run: mvn -B org.pitest:pitest-maven:mutationCoverage -DskipTests || true
      - name: Extract mutation score
        id: extract_score
        run: |
          SCORE=$(mvn org.pitest:pitest-maven:report -q -DskipTests 2>/dev/null | grep -oP 'Killed \K[0-9]+(?=/[0-9]+)' | head -1)
          if [ -z "$SCORE" ]; then
            SCORE=$(cat target/pit-reports/index.html | grep -oP 'Line Coverage: \K[0-9.]+' | head -1)
          fi
          echo "mutation_score=$SCORE" >> $GITHUB_OUTPUT
      - name: Download previous mutation score
        id: download_score
        uses: actions/download-artifact@v4
        with:
          name: mutation-score-java-${{ matrix.java-version }}
          path: previous-score
        continue-on-error: true
      - name: Compare mutation scores
        run: |
          CURRENT_SCORE="${{ steps.extract_score.outputs.mutation_score }}"
          
          if [ -f previous-score/score.txt ]; then
            PREVIOUS_SCORE=$(cat previous-score/score.txt)
            echo "Previous score: $PREVIOUS_SCORE"
            echo "Current score: $CURRENT_SCORE"
            
            if (( $(echo "$CURRENT_SCORE < $PREVIOUS_SCORE" | bc -l) )); then
              echo "ERROR: Mutation score decreased from $PREVIOUS_SCORE to $CURRENT_SCORE"
              exit 1
            fi
          else
            echo "No previous score found, storing current score"
          fi
      - name: Save mutation score
        run: |
          mkdir -p mutation-score-artifact
          echo "${{ steps.extract_score.outputs.mutation_score }}" > mutation-score-artifact/score.txt
      - name: Upload mutation score artifact
        uses: actions/upload-artifact@v4
        with:
          name: mutation-score-java-${{ matrix.java-version }}
          path: mutation-score-artifact/score.txt