name: Mutation Tests

on:
  workflow_dispatch:
  push:
    paths:
      - "core/**"
      - ".github/workflows/mutation-tests.yml"

jobs:
  mutation-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 21       # recommandé pour PiTest
          distribution: temurin
          cache: maven           # cache du repo Maven (~/.m2)

      # ------------------------
      # Build léger (pas de clean)
      # ------------------------
      - name: Build (fast incremental)
        working-directory: ./core
        run: mvn -B -DskipTests package

      # ------------------------
      # PiTest
      # ------------------------
      - name: Run PiTest
        working-directory: ./core
        run: |
          mvn -B org.pitest:pitest-maven:mutationCoverage \
            -DoutputFormats=XML,HTML

      # ------------------------
      # Score de mutation
      # ------------------------
      - name: Compute mutation score
        run: |
          REPORT=./core/target/pit-reports/mutations.xml
          if [ ! -f "$REPORT" ]; then
            echo "❌ mutations.xml introuvable"
            exit 1
          fi

          TOTAL=$(grep -c "<mutation " "$REPORT")
          KILLED=$(grep -c "status='KILLED'" "$REPORT")
          SCORE=$(echo "scale=2; ($KILLED * 100) / $TOTAL" | bc)
          
          echo "🎯 Mutation Score: $SCORE%"
