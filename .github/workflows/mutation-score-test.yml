name: Mutation Tests
on: 
  workflow_dispatch:
jobs:
  mutation-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [ 24, 25-ea ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
      - name: Build project
        run: mvn -Dkey=$API_KEY clean install -B
      - name: Run mutation tests on core repository
        run: mvn -B org.pitest:pitest-maven:mutationCoverage -DskipTests || true
        working-directory: ./core
      - name: Extract mutation score
        id: extract_score
        run: |
          echo "=== Checking for PiTest reports in core repository ==="
          find ./core/target -name "index.html" -path "*/pit-reports/*" 2>/dev/null || echo "No pit-reports found"
          
          echo "=== Extracting mutation score ==="
          SCORE=""
          
          # Try mutations.xml first (most reliable)
          if [ -f ./core/target/pit-reports/mutations.xml ]; then
            SCORE=$(grep -oP 'percentage="\K[^"]+' ./core/target/pit-reports/mutations.xml | head -1)
            echo "Extracted from mutations.xml: $SCORE%"
          fi
          
          # Fallback to HTML if XML didn't work
          if [ -z "$SCORE" ] && [ -f ./core/target/pit-reports/index.html ]; then
            echo "Trying HTML report..."
            SCORE=$(grep -oP '>\d+\.\d+%<' ./core/target/pit-reports/index.html | grep -oP '\d+\.\d+' | head -1)
            echo "Extracted from HTML: $SCORE%"
          fi
          
          if [ -z "$SCORE" ]; then
            echo "WARNING: Could not extract mutation score from any report"
            SCORE="0"
          fi
          
          echo "Final mutation score: $SCORE"
          echo "mutation_score=$SCORE" >> $GITHUB_OUTPUT
      - name: Download previous mutation score
        id: download_score
        uses: actions/download-artifact@v4
        with:
          name: mutation-score-java-${{ matrix.java-version }}
          path: previous-score
        continue-on-error: true
      - name: Compare mutation scores
        run: |
          CURRENT_SCORE="${{ steps.extract_score.outputs.mutation_score }}"
          
          if [ -f previous-score/score.txt ]; then
            PREVIOUS_SCORE=$(cat previous-score/score.txt)
            echo "Previous score: $PREVIOUS_SCORE"
            echo "Current score: $CURRENT_SCORE"
            
            if (( $(echo "$CURRENT_SCORE < $PREVIOUS_SCORE" | bc -l) )); then
              echo "ERROR: Mutation score decreased from $PREVIOUS_SCORE to $CURRENT_SCORE"
              exit 1
            fi
          else
            echo "No previous score found, storing current score"
          fi
      - name: Save mutation score
        run: |
          mkdir -p mutation-score-artifact
          echo "${{ steps.extract_score.outputs.mutation_score }}" > mutation-score-artifact/score.txt
      - name: Upload mutation score artifact
        uses: actions/upload-artifact@v4
        with:
          name: mutation-score-java-${{ matrix.java-version }}
          path: mutation-score-artifact/score.txt