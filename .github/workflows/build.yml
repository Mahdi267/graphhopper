name: Build and Test
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [ 24, 25-ea ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
      - name: Cache Maven artifacts
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Cache node
        uses: actions/cache@v4
        with:
          path: web-bundle/node
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os}}-node-
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: web-bundle/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml', '**/package.json') }}
          restore-keys: |
            ${{ runner.os}}-node_modules-
      - name: Build ${{ matrix.java-version }}
        run: mvn -B clean test

      - name: Run PiTest
        working-directory: ./core
        run: mvn -B org.pitest:pitest-maven:mutationCoverage -DoutputFormats=XML,HTML

      - name: Calculate mutation score
        id: mutation_score
        run: |
          REPORT=./core/target/pit-reports/mutations.xml

          if [ ! -f "$REPORT" ]; then
            echo "score=0" >> $GITHUB_OUTPUT
            exit 0
          fi

          TOTAL=$(grep -c "<mutation " "$REPORT" || echo "0")
          KILLED=$(grep -c "status='KILLED'" "$REPORT" || echo "0")

          if [ "$TOTAL" -gt 0 ]; then
            SCORE=$(echo "scale=2; ($KILLED * 100) / $TOTAL" | bc)
          else
            SCORE="0"
          fi

          echo " Mutation Score: $SCORE%"
          echo "score=$SCORE" >> $GITHUB_OUTPUT

      - name: Download previous score
        uses: actions/download-artifact@v4
        with:
          name: mutation-score-java-${{ matrix.java-version }}
          path: previous-score
        continue-on-error: true

      - name: Check mutation score - FAIL if decreased
        run: |
          CURRENT="${{ steps.mutation_score.outputs.score }}"

          if [ -f previous-score/score.txt ]; then
            PREVIOUS=$(cat previous-score/score.txt)
            echo "Previous: $PREVIOUS% | Current: $CURRENT%"

            if (( $(echo "$CURRENT < $PREVIOUS" | bc -l) )); then
              echo " BUILD FAILED: Mutation score decreased from $PREVIOUS% to $CURRENT%"
              exit 1
            fi
          fi

      - name: Save mutation score
        if: success()
        run: |
          mkdir -p mutation-score
          echo "${{ steps.mutation_score.outputs.score }}" > mutation-score/score.txt

      - name: Upload mutation score
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-score-java-${{ matrix.java-version }}
          path: mutation-score/score.txt

